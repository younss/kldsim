# Rootless-Podman-friendly multi-container stack for KLD Sim.
# Quick start:
#   cp .env.example .env   # then edit the secrets
#   podman-compose up --build
# The app is served at http://localhost:${WEB_PORT:-8080}

networks:
  kldsim:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kldsim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kldsim_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-kldsim}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [kldsim]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kldsim} -d ${POSTGRES_DB:-kldsim}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: docker.io/library/redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks: [kldsim]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Ollama is NOT containerized here — it points at the Ollama instance
  # already installed and running natively on the host (see api's
  # OLLAMA_BASE_URL below), which gets GPU acceleration and the full host
  # memory instead of being boxed into the Podman VM's limited RAM.

  api:
    build:
      context: .
      dockerfile: infra/containerfiles/api.Containerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-kldsim}:${POSTGRES_PASSWORD:-kldsim_dev_password}@postgres:5432/${POSTGRES_DB:-kldsim}?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:?Set MASTER_ENCRYPTION_KEY in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      # host.containers.internal reaches the Mac host from inside the Podman
      # VM — points at the Ollama app already installed/running natively.
      OLLAMA_BASE_URL: "http://host.containers.internal:11434"
      OLLAMA_DEFAULT_MODEL: ${OLLAMA_DEFAULT_MODEL:-gemma3:4b}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks: [kldsim]
    ports:
      - "${API_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: infra/containerfiles/web.Containerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks: [kldsim]
    ports:
      - "${WEB_PORT:-8080}:8080"
